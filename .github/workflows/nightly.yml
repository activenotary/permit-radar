name: nightly-pipeline
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python3 ingest.py
        env:
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
      - run: python3 enrich.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python3 digest.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - run: python3 pseo.py
      - name: Commit results
        run: |
          git config user.name "permit-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add permits.db docs/ out/
          git commit -m "nightly update" || echo "no changes"
          git push
